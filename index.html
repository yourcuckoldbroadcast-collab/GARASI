<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garasi Log</title>
<meta name="description" content="Catatan servis kendaraan & pengingat berbasis odometer dan waktu. Offline, gratis, datamu milikmu.">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#14110d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Garasi">
<link rel="apple-touch-icon" href="./icon192.png">
<link rel="icon" href="./icon48.png">
<style>
  :root{
    --bg:#14110d; --bg2:#1b1711; --panel:#211c14; --panel2:#2a241a;
    --line:rgba(255,210,140,.10); --line2:rgba(255,210,140,.16);
    --text:#f3ecdd; --muted:#9c917d; --faint:#6f6453;
    --amber:#ffc454; --amber-dim:#caa04a;
    --green:#41d97f; --orange:#ff9d2e; --red:#ff5d52;
    --chart-svc:#5ad1c4;
    --shadow:0 18px 40px -18px rgba(0,0,0,.8);
    --mono:ui-monospace,"Roboto Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--sans); color:var(--text); background:var(--bg);
    background-image:
      radial-gradient(1200px 500px at 50% -10%, rgba(255,180,80,.10), transparent 60%),
      radial-gradient(700px 400px at 90% 110%, rgba(255,120,40,.06), transparent 60%);
    background-attachment:fixed;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px 14px;background:linear-gradient(var(--bg) 60%, rgba(20,17,13,.4));backdrop-filter:blur(6px)}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 35%, #2b241a, #15110c);border:1px solid var(--line2);
    box-shadow:inset 0 1px 0 rgba(255,200,120,.12)}
  .logo svg{width:24px;height:24px}
  .brand h1{font-family:var(--mono);font-size:15px;letter-spacing:.32em;margin:0;text-transform:uppercase;font-weight:600}
  .brand small{display:block;font-size:9.5px;letter-spacing:.34em;color:var(--faint);margin-top:2px}
  .iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--muted);width:40px;height:40px;
    border-radius:11px;display:grid;place-items:center;cursor:pointer;transition:.18s}
  .iconbtn:active{transform:scale(.93)}
  .iconbtn svg{width:20px;height:20px}

  .vbar{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 14px;scrollbar-width:none}
  .vbar::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);
    padding:9px 15px;border-radius:99px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.18s;white-space:nowrap}
  .chip:active{transform:scale(.96)}
  .chip.active{color:#1a140a;background:linear-gradient(180deg,#ffce6e,#f5a623);border-color:transparent;
    box-shadow:0 6px 16px -6px rgba(245,166,35,.6)}
  .chip.add{color:var(--amber);border-style:dashed;border-color:var(--line2);background:transparent}

  main{flex:1;padding:0 18px 120px}

  .odo{position:relative;border:1px solid var(--line2);border-radius:20px;
    background:linear-gradient(160deg,#241e15,#17130d);box-shadow:var(--shadow);
    padding:20px 20px 18px;margin-bottom:18px;overflow:hidden}
  .odo::before{content:"";position:absolute;inset:0;
    background:radial-gradient(420px 120px at 30% 0%, rgba(255,196,84,.12),transparent 70%);pointer-events:none}
  .odo .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;color:var(--faint);text-transform:uppercase}
  .readout{display:flex;align-items:baseline;gap:10px;margin-top:8px}
  .readout .num{font-family:var(--mono);font-weight:700;font-size:clamp(38px,11.5vw,56px);line-height:1;
    color:var(--amber);text-shadow:0 0 22px rgba(255,196,84,.35);letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .readout .unit{font-family:var(--mono);font-size:16px;color:var(--amber-dim);letter-spacing:.15em}
  .odo-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .odo .editbtn{flex:0 0 auto;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    color:var(--amber);background:rgba(255,196,84,.08);border:1px solid var(--line2);padding:7px 12px;border-radius:9px;
    cursor:pointer;display:flex;align-items:center;gap:6px;text-transform:uppercase}
  .odo .editbtn:active{transform:scale(.95)}

  .sect{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 12px;gap:10px}
  .sect h2{font-family:var(--mono);font-size:11px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;margin:0;font-weight:600}
  .seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--panel)}
  .seg button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    border:none;background:transparent;color:var(--faint);padding:7px 11px;cursor:pointer}
  .seg button.on{background:linear-gradient(180deg,#ffce6e,#f5a623);color:#1a140a}

  .rem{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:14px 15px 13px;
    margin-bottom:12px;position:relative;overflow:hidden;transition:opacity .15s,transform .12s}
  .rem.dragging{opacity:.6;transform:scale(.99);border-color:var(--amber)}
  .rem.tap{cursor:pointer}
  .rem.tap:active{background:var(--panel2)}
  .rem .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px}
  .rem .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .rem .name{font-size:16px;font-weight:700;margin:0 0 4px;color:var(--text);display:flex;align-items:center;gap:7px}
  .pinmark{color:var(--amber);font-size:12px}
  .rem .meta{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.03em}
  .badge{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:5px 9px;
    border-radius:8px;text-transform:uppercase;white-space:nowrap;flex:0 0 auto}
  .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.06);margin:12px 0 9px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
  .rem .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .rests{display:flex;gap:6px;flex-wrap:wrap}
  .rpill{font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.05);color:var(--muted)}
  .rpill b{color:var(--text)}
  .rem .acts{display:flex;gap:6px;align-items:center}
  .mini{font-size:12px;font-weight:600;border-radius:9px;padding:8px 10px;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--muted);transition:.15s;line-height:1}
  .mini:active{transform:scale(.92)}
  .mini.go{color:var(--green);border-color:rgba(65,217,127,.3)}
  .mini.pin.on{color:var(--amber);border-color:rgba(255,196,84,.4);background:rgba(255,196,84,.08)}
  .handle{touch-action:none;cursor:grab;color:var(--faint);padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
  .arrows{display:flex;flex-direction:column;gap:3px}
  .arrows button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:7px;
    width:30px;height:18px;display:grid;place-items:center;cursor:pointer;font-size:10px;line-height:1}

  .s-safe{--c:var(--green)} .s-warn{--c:var(--orange)} .s-danger{--c:var(--red)}
  .s-safe .stripe,.s-warn .stripe,.s-danger .stripe{background:var(--c);box-shadow:0 0 14px -2px var(--c)}
  .s-safe .bar>i,.s-warn .bar>i,.s-danger .bar>i{background:var(--c)}
  .s-safe .badge{color:var(--green);background:rgba(65,217,127,.12)}
  .s-warn .badge{color:var(--orange);background:rgba(255,157,46,.12)}
  .s-danger .badge{color:var(--red);background:rgba(255,93,82,.14)}

  .addrem{width:100%;border:1px dashed var(--line2);background:transparent;color:var(--amber);border-radius:14px;
    padding:14px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px}
  .addrem:active{transform:scale(.98)}


  .empty{text-align:center;padding:54px 24px;color:var(--muted)}
  .empty .big{width:72px;height:72px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 35%,#2b241a,#15110c);border:1px solid var(--line2)}
  .empty .big svg{width:42px;height:42px}
  .empty h3{margin:0 0 6px;font-size:18px;color:var(--text)}
  .empty p{margin:0 auto 22px;max-width:300px;font-size:14px;line-height:1.55}
  .cta{background:linear-gradient(180deg,#ffce6e,#f5a623);color:#1a140a;border:none;padding:13px 22px;border-radius:12px;
    font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 10px 24px -8px rgba(245,166,35,.55)}
  .cta:active{transform:scale(.97)}

  .scrim{position:fixed;inset:0;background:rgba(8,6,3,.72);backdrop-filter:blur(3px);z-index:50;display:none;
    align-items:flex-end;justify-content:center}
  .scrim.show{display:flex}
  .sheet{width:100%;max-width:560px;background:var(--bg2);border:1px solid var(--line2);border-radius:22px 22px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px -10px rgba(0,0,0,.7);
    animation:up .28s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow-y:auto}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
  .sheet h3{margin:0 0 16px;font-size:18px;display:flex;align-items:center;gap:9px}
  .field{margin-bottom:14px}
  .field label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);
    text-transform:uppercase;margin-bottom:7px}
  .field input,.field select,.field textarea{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--text);
    border-radius:12px;padding:13px 14px;font-size:16px;font-family:var(--sans);outline:none;transition:.15s}
  .field textarea{min-height:64px;resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,196,84,.13)}
  .field .hint{font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.4}
  .field .err{font-size:12px;color:var(--red);margin-top:6px;display:none}
  .field.bad input,.field.bad select{border-color:var(--red)}
  .field.bad .err{display:block}
  .fboard{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:11px 14px;margin:2px 0 14px}
  .fb-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0;font-size:13.5px;color:var(--muted)}
  .fb-row+.fb-row{border-top:1px solid var(--line)}
  .fb-row b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  .fb-bud{color:var(--faint);font-weight:600;font-size:12px}
  .fb-alert{margin-top:10px;border-radius:10px;padding:9px 11px;font-size:13px;font-weight:700;line-height:1.35}
  .fb-alert.ok{color:var(--green);background:rgba(65,217,127,.10);border:1px solid rgba(65,217,127,.25)}
  .fb-alert.warn{color:var(--orange);background:rgba(255,157,46,.12);border:1px solid rgba(255,157,46,.3)}
  .fb-alert.over{color:var(--red);background:rgba(255,93,82,.14);border:1px solid rgba(255,93,82,.35)}
  .fb-note{margin-top:10px;font-size:12px;color:var(--faint);line-height:1.4}
  .budg{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#1d1810,#181410);padding:14px 14px 13px;margin-bottom:8px}
  .budg-h{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin-bottom:10px}
  .budg-amt{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--text);margin-bottom:9px}
  .budg-amt span{color:var(--muted);font-size:14px;font-weight:700}
  .budg-barrow{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .budg-track{flex:1;height:14px;border-radius:8px;background:rgba(255,255,255,.05);background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1px);background-size:5px 5px;overflow:hidden;border:1px solid var(--line)}
  .budg-fill{height:100%;border-radius:8px 0 0 8px;min-width:6px;transition:width .5s ease}
  .budg-fill.full{border-radius:8px}
  .budg-fill.ok{background:var(--green)}
  .budg-fill.warn{background:var(--orange)}
  .budg-fill.over{background:var(--red)}
  .budg-pct{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text);min-width:40px;text-align:right}
  .budg-sisa{font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:9px}
  .budg-sisa.over{color:var(--red);font-weight:700}
  .budg-proj{font-size:12.5px;color:var(--muted);line-height:1.55}
  .budg-proj b{font-family:var(--mono);font-size:14px;color:var(--text)}
  .budg-verdict{font-weight:700}
  .budg-verdict.ok{color:var(--green)} .budg-verdict.bad{color:var(--red)}
  .two{display:flex;gap:10px}.two>*{flex:1}
  .row{display:flex;gap:10px;margin-top:6px}
  .btn{flex:1;padding:14px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;border:1px solid var(--line2)}
  .btn.ghost{background:transparent;color:var(--muted)}
  .btn.primary{background:linear-gradient(180deg,#ffce6e,#f5a623);color:#1a140a;border:none;box-shadow:0 8px 20px -8px rgba(245,166,35,.5)}
  .btn.danger{background:var(--red);color:#fff;border:none}
  .btn:active{transform:scale(.97)}
  .menu-item{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:transparent;border:none;
    color:var(--text);padding:15px 6px;font-size:15px;cursor:pointer;border-bottom:1px solid var(--line)}
  .menu-item:last-child{border-bottom:none}
  .menu-item svg{width:21px;height:21px;color:var(--amber);flex:0 0 auto}
  .menu-item small{display:block;color:var(--faint);font-size:12px;margin-top:2px}

  /* detail sheet */
  .dt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
  .dt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .dt-cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .dt-cell .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin-bottom:5px}
  .dt-cell .v{font-size:14px;color:var(--text);font-weight:600}
  .dt-cell .v small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
  .logitem{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;background:var(--panel)}
  .logitem .lh{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .logitem .ldate{font-weight:700;font-size:14px}
  .logitem .lodo{font-family:var(--mono);font-size:12px;color:var(--amber-dim)}
  .logitem .lcost{font-family:var(--mono);font-size:12px;color:var(--green);margin-top:4px}
  .logitem .lnote{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45;white-space:pre-wrap}
  .logitem .lact{display:flex;gap:8px;margin-top:9px}
  .logitem .lact button{font-size:11.5px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);
    border-radius:8px;padding:6px 10px;cursor:pointer}
  .logitem .lact .x{color:var(--red);border-color:rgba(255,93,82,.25)}
  .emptylog{color:var(--faint);font-size:13px;text-align:center;padding:14px 0}

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#2c2519;
    border:1px solid var(--line2);color:var(--text);padding:12px 18px;border-radius:12px;font-size:14px;z-index:90;
    opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow);max-width:90%}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* confirm overlay (stacks above sheet) */
  #cf{position:fixed;inset:0;background:rgba(8,6,3,.6);z-index:70;display:none;align-items:center;justify-content:center;padding:22px}
  #cf.show{display:flex}
  #cf .box{background:var(--bg2);border:1px solid var(--line2);border-radius:18px;padding:20px;max-width:380px;width:100%;box-shadow:var(--shadow)}
  #cf h4{margin:0 0 8px;font-size:17px}
  #cf p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.55}

  #install{display:none;margin:0 18px 14px;align-items:center;gap:12px;background:linear-gradient(160deg,#241e15,#1a160f);
    border:1px solid var(--line2);border-radius:14px;padding:12px 14px}
  #install.show{display:flex}
  #install p{margin:0;font-size:13px;color:var(--muted);flex:1;line-height:1.4}
  #install b{color:var(--text)}
  #install button{background:var(--amber);color:#1a140a;border:none;padding:9px 14px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
  #install .x{background:transparent;color:var(--faint);padding:8px;font-size:18px;border:none}

  /* ===== view system + bottom nav (lapisan tampilan baru) ===== */
  main#app{flex:1;padding:4px 18px calc(100px + env(safe-area-inset-bottom));animation:vfade .32s cubic-bezier(.2,.7,.2,1) both}
  @keyframes vfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .vtitle{font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin:8px 2px 16px;font-weight:600}

  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
    background:linear-gradient(rgba(20,17,13,.25),var(--bg2) 55%);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
  .tabbar .inner{display:flex;width:100%;max-width:560px}
  .tabbar button{flex:1;background:none;border:none;color:var(--faint);display:flex;flex-direction:column;
    align-items:center;gap:4px;padding:5px 0;cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;transition:.15s}
  .tabbar button:active{transform:scale(.92)}
  .tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button.on{color:var(--amber)}
  .tabbar button .ind{width:18px;height:2px;border-radius:2px;background:transparent;margin-top:1px;transition:.15s}
  .tabbar button.on .ind{background:var(--amber);box-shadow:0 0 8px -1px var(--amber)}

  .back{display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--amber);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;cursor:pointer;padding:8px 0 12px}
  .back svg{width:15px;height:15px}
  .back:active{opacity:.6}

  /* vehicle tag inside cross-vehicle feed */
  .vtag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--amber-dim);
    background:rgba(255,196,84,.08);border:1px solid var(--line2);padding:2px 7px;border-radius:6px;margin-bottom:6px;text-transform:uppercase}

  /* work order card */
  .wo{border:1px solid rgba(255,196,84,.28);border-radius:16px;background:var(--panel);padding:14px 15px;
    margin-bottom:11px;position:relative;overflow:hidden}
  .wo .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--amber);animation:wopulse 1.8s ease-in-out infinite}
  @keyframes wopulse{0%,100%{opacity:1}50%{opacity:.4}}
  .wo .wt{font-size:15.5px;font-weight:700;color:var(--text)}
  .wo .wm{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:5px;letter-spacing:.04em}
  .wo .wacts{display:flex;gap:8px;margin-top:13px;align-items:center}
  .wo .wacts .btn{flex:0 1 auto}

  /* vehicle list card */

"use strict";
const KEY="garasi-log-v1";

const clean=v=>{const n=parseInt(String(v).replace(/[^\d]/g,""),10);return isNaN(n)?0:n;};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- dates ---- */
const MON=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const MONL=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const DAYL=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr=()=>ymd(new Date());
function parseD(s){const p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addMonths(s,n){const d=parseD(s);const day=d.getDate();d.setMonth(d.getMonth()+Number(n));if(d.getDate()<day)d.setDate(0);return ymd(d);}
function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
const fmtD=s=>{if(!s)return "—";const d=parseD(s);return d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear();};

const DICT_MOBIL_MANUAL=mkDict({

function dictFor(v){
  const key=((v&&v.vtype)||"")+"-"+((v&&v.trans)||"");
  if(key==="motor-matic")return DICT_MATIC_MOTOR;
  if(key==="mobil-manual")return DICT_MOBIL_MANUAL;
  if(key==="mobil-matic")return DICT_MOBIL_MATIC;
  if(key==="motor-manual")return DICT_MOTOR_MANUAL;
  return DICT_DEFAULT;
}
function tierOf(r,v){
  const cats=dictFor(v);
  if(r.category){const c=cats.find(c=>c.name===r.category);if(c)return c.tier;}
  const n=(r.name||"").toLowerCase();
  for(const c of cats){for(const k of c.kw){if(k&&n.includes(k))return c.tier;}}
  return "Null";
}

let state={vehicles:[],selected:null};

/* ---------- storage + migration ---------- */
function migrate(s){
  if(!s||typeof s!=="object")s={vehicles:[],selected:null};
  if(!Array.isArray(s.vehicles))s.vehicles=[];
  s.vehicles.forEach(v=>{
    v.odo=clean(v.odo);
    v.fuelBudget=clean(v.fuelBudget); // budget bensin bulanan (Rp); 0 = belum diatur
    if(v.sortMode!=="manual")v.sortMode="auto";
    if(!v.vtype)v.vtype="motor";
    if(!v.trans)v.trans="matic";
    if(!Array.isArray(v.reminders))v.reminders=[];
    v.reminders.forEach((r,ri)=>{
      if(r.intervalKm==null&&r.interval!=null)r.intervalKm=clean(r.interval);
      delete r.interval;
      r.intervalKm=clean(r.intervalKm);
      r.intervalMonths=clean(r.intervalMonths);
      if(r.baseOdo==null&&r.base!=null)r.baseOdo=clean(r.base);
      delete r.base;
      r.baseOdo=clean(r.baseOdo);
      if(r.baseDate&&!/^\d{4}-\d{2}-\d{2}$/.test(r.baseDate))r.baseDate=null;
      // anchor awal (kondisi sebelum ada catatan servis) — dipakai saat Riwayat kosong
      if(r.initOdo==null)r.initOdo=clean(r.baseOdo);else r.initOdo=clean(r.initOdo);
      if(r.initDate===undefined)r.initDate=r.baseDate||null;
      if(r.initDate&&!/^\d{4}-\d{2}-\d{2}$/.test(r.initDate))r.initDate=null;
      if(typeof r.pinned!=="boolean")r.pinned=false;
      if(r.order==null)r.order=ri;
      if(!Array.isArray(r.logs))r.logs=[];
      r.logs=r.logs.filter(l=>l&&/^\d{4}-\d{2}-\d{2}$/.test(l.date))
        .map(l=>({id:l.id||uid(),date:l.date,odo:clean(l.odo),cost:clean(l.cost),note:typeof l.note==="string"?l.note:""}));
      if(r.category===undefined)r.category=null;
      if(r.category&&!dictFor(v).some(c=>c.name===r.category))r.category=null;
      r.id=r.id||uid();
      recomputeBase(r); // selaraskan acuan siklus dengan Riwayat
    });
    if(!Array.isArray(v.workOrders))v.workOrders=[];
    const _rids=new Set(v.reminders.map(r=>r.id));
    v.workOrders=v.workOrders
      .filter(w=>w&&_rids.has(w.reminderId))
      .map(w=>({id:w.id||uid(),reminderId:w.reminderId,
        opened:/^\d{4}-\d{2}-\d{2}$/.test(w.opened)?w.opened:todayStr(),
        note:typeof w.note==="string"?w.note:""}));
    if(!Array.isArray(v.odoLog))v.odoLog=[];
    v.odoLog=v.odoLog
      .filter(p=>p&&/^\d{4}-\d{2}-\d{2}$/.test(p.date))
      .map(p=>({date:p.date,odo:clean(p.odo)}))
      .filter(p=>p.odo>0);
    if(!Array.isArray(v.fuelLog))v.fuelLog=[];
    v.fuelLog=v.fuelLog
      .filter(p=>p&&/^\d{4}-\d{2}-\d{2}$/.test(p.date))
      .map(p=>({id:p.id||uid(),date:p.date,odo:clean(p.odo),
        liters:(typeof p.liters==="number"&&p.liters>0)?p.liters:(parseFloat(p.liters)>0?parseFloat(p.liters):0),
        cost:clean(p.cost),
        fuel:typeof p.fuel==="string"?p.fuel:"",
        place:typeof p.place==="string"?p.place:""}))
      .filter(p=>p.cost>0||p.liters>0||p.odo>0);
  });
  if(!s.selected||!s.vehicles.some(v=>v.id===s.selected))
    s.selected=s.vehicles[0]?s.vehicles[0].id:null;
  return s;
}

/* ---------- acuan siklus = TURUNAN dari Riwayat Servis (single source of truth) ----------
   baseOdo/baseDate bukan lagi angka yang berdiri sendiri, melainkan cache yang dihitung
   ulang dari {anchor awal + seluruh catatan servis}. Acuan = peristiwa TERBARU.
   Dipanggil tiap kali log servis ditambah / diedit / dihapus → "terakhir diganti"
   tak pernah melenceng dari Riwayat, dan servis yang di-backfill tak merusak siklus. */
function recomputeBase(r){
  const ev=[];
  if(r.initDate)ev.push({date:r.initDate,odo:clean(r.initOdo)});
  (r.logs||[]).forEach(l=>{if(l&&l.date)ev.push({date:l.date,odo:clean(l.odo)});});
  if(!ev.length){r.baseOdo=clean(r.initOdo);r.baseDate=r.initDate||null;return;}
  ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.odo-b.odo);
  const last=ev[ev.length-1];
  r.baseOdo=last.odo;r.baseDate=last.date;
}
/* true bila tanggal d lebih lama dari servis terbaru yang sudah ada (tak akan menggeser siklus) */
function isStale(r,d){
  let latest=r.initDate||null;
  (r.logs||[]).forEach(l=>{if(l&&l.date&&(!latest||l.date>latest))latest=l.date;});
  return latest!=null&&d<latest;
}

/* ---------- status (hybrid km + bulan, mana lebih dulu) ---------- */
function status(r,odo){
  const today=todayStr();
  let sev=2,pct=0,kmRem=null,dateRem=null,dueOdo=null,dueDate=null;
  if(r.intervalKm>0){
    dueOdo=r.baseOdo+r.intervalKm; kmRem=dueOdo-odo;
    pct=Math.max(pct,Math.min(100,Math.max(0,((odo-r.baseOdo)/r.intervalKm)*100)));
    const th=Math.max(r.intervalKm*0.1,100);
    sev=Math.min(sev, kmRem<=0?0:(kmRem<=th?1:2));
  }
  if(r.intervalMonths>0&&r.baseDate){
    dueDate=addMonths(r.baseDate,r.intervalMonths); dateRem=diffDays(today,dueDate);
    const total=Math.max(1,diffDays(r.baseDate,dueDate)), used=diffDays(r.baseDate,today);
    pct=Math.max(pct,Math.min(100,Math.max(0,(used/total)*100)));
    const th=Math.max(Math.round(total*0.1),7);
    sev=Math.min(sev, dateRem<=0?0:(dateRem<=th?1:2));
  }
  const sName=sev===0?"danger":sev===1?"warn":"safe";
  const label=sev===0?"HARUS GANTI":sev===1?"SEGERA":"AMAN";
  return {sev,sName,label,pct:Math.round(pct),kmRem,dateRem,dueOdo,dueDate};
}

/* ---------- sorting ---------- */
function sortedReminders(v){
  const list=[...v.reminders];
  if(v.sortMode==="manual")return list.sort((a,b)=>(a.order||0)-(b.order||0));
  return list.sort((a,b)=>{
    if((b.pinned?1:0)!==(a.pinned?1:0))return (b.pinned?1:0)-(a.pinned?1:0);
    const sa=status(a,v.odo),sb=status(b,v.odo);
    if(sa.sev!==sb.sev)return sa.sev-sb.sev;       // urgensi menang (danger=0 dulu)
    const ta=gradeRank(tierOf(a,v)),tb=gradeRank(tierOf(b,v));
    if(ta!==tb)return ta-tb;                        // prioritas jenis (S dulu)
    return sb.pct-sa.pct;                           // progres lebih tinggi dulu
  });
}

function attentionItems(){
  const items=[];
  state.vehicles.forEach(v=>v.reminders.forEach(r=>{const s=status(r,v.odo);if(s.sev<2)items.push({v,r,s});}));
  items.sort((a,b)=>a.s.sev-b.s.sev||b.s.pct-a.s.pct);
  return items;
}
/* servis yang MASIH aman tapi paling dekat jatuh tempo (untuk persiapan dana) */
function upcomingItems(limit){
  const items=[];
  state.vehicles.forEach(v=>v.reminders.forEach(r=>{const s=status(r,v.odo);if(s.sev===2&&s.pct>0)items.push({v,r,s});}));
  items.sort((a,b)=>b.s.pct-a.s.pct);
  return items.slice(0,limit||2);
}
function openWorkOrders(){
  const out=[];
  state.vehicles.forEach(v=>(v.workOrders||[]).forEach(w=>{const r=v.reminders.find(x=>x.id===w.reminderId);if(r)out.push({v,w,r});}));
  out.sort((a,b)=>a.w.opened<b.w.opened?-1:1);
  return out;
}
const monthKey=d=>String(d).slice(0,7);
function relDays(d){if(!d)return null;const n=diffDays(d,todayStr());return n<=0?"hari ini":n===1?"kemarin":n+" hari lalu";}
function lastFuelDate(v){const f=(v.fuelLog||[]);return f.length?f.map(x=>x.date).sort().slice(-1)[0]:null;}
function lastOdoDate(v){
  let best=null;
  (v.odoLog||[]).forEach(p=>{if(!best||p.date>best)best=p.date;});
  (v.fuelLog||[]).forEach(p=>{if(p.odo>0&&(!best||p.date>best))best=p.date;});
  v.reminders.forEach(r=>r.logs.forEach(l=>{if(l.odo>0&&(!best||l.date>best))best=l.date;}));
  return best;
}
function touchedThisMonth(v){
  const mk=monthKey(todayStr());
  return (v.odoLog||[]).some(p=>monthKey(p.date)===mk)||(v.fuelLog||[]).some(p=>monthKey(p.date)===mk);
}

/* ---------- statistik (turunan, read-only) ---------- */
function allLogs(){const out=[];state.vehicles.forEach(v=>v.reminders.forEach(r=>r.logs.forEach(l=>out.push({v,r,l}))));return out;}
function vehiclePoints(v){
  const m={};
  v.reminders.forEach(r=>r.logs.forEach(l=>{if(l.odo>0)m[l.date]=Math.max(m[l.date]||0,l.odo);}));
  (v.odoLog||[]).forEach(p=>{if(p.odo>0)m[p.date]=Math.max(m[p.date]||0,p.odo);});
  (v.fuelLog||[]).forEach(p=>{if(p.odo>0)m[p.date]=Math.max(m[p.date]||0,p.odo);});
  // catatan: TIDAK menyuntik odo "hari ini" — laju & jarak hanya dari titik yang benar-benar dicatat,
  // supaya hari yang belum dicatat tidak dianggap sebagai hari parkir (bias palsu).
  return Object.keys(m).sort().map(d=>({date:d,odo:m[d]}));
}
/* ambang deteksi perjalanan jauh — tunable, dikalibrasi dari data tester */
const TRIP_RATE_MULT=2.5;   // segmen dianggap "trip" bila lajunya > 2.5× median
const TRIP_KM_FLOOR=200;    // dan jaraknya minimal 200 km dalam satu segmen
const MIN_SEGMENTS=3;       // butuh ≥3 segmen sebelum deteksi outlier bermakna
function median(arr){if(!arr.length)return null;const a=[...arr].sort((x,y)=>x-y);const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2;}
function vehicleSegments(v){
  const p=vehiclePoints(v);const segs=[];
  for(let i=0;i<p.length-1;i++){
    const km=p[i+1].odo-p[i].odo,days=Math.max(1,diffDays(p[i].date,p[i+1].date));
    if(km<0)continue;
    segs.push({from:p[i],to:p[i+1],km,days,rate:km/days});
  }
  return segs;
}
function tripFuel(v,trip){
  const f=(v.fuelLog||[]).filter(x=>x.date>trip.from.date&&x.date<=trip.to.date);
  const cost=f.reduce((a,x)=>a+(x.cost||0),0);
  const liters=f.reduce((a,x)=>a+(x.liters||0),0);
  return {cost,liters,kmPerL:liters>0?trip.km/liters:null};
}
function vehicleDist(v){
  const p=vehiclePoints(v);if(p.length<2)return null;
  const first=p[0],last=p[p.length-1];
  const km=Math.max(0,last.odo-first.odo),days=diffDays(first.date,last.date);
  if(days<=0||km<=0)return null;
  const perDayAll=km/days;                                   // gabungan (termasuk trip)
  const segs=vehicleSegments(v);
  let perDay=perDayAll,trips=[],thin=segs.length<MIN_SEGMENTS;
  if(!thin){
    const med=median(segs.map(s=>s.rate));
    if(med>0){
      const isTrip=s=>s.rate>med*TRIP_RATE_MULT&&s.km>=TRIP_KM_FLOOR;
      trips=segs.filter(isTrip).map(s=>({from:s.from,to:s.to,km:s.km,days:s.days,rate:s.rate}));
      const normal=segs.filter(s=>!isTrip(s));
      const nKm=normal.reduce((a,s)=>a+s.km,0),nDays=normal.reduce((a,s)=>a+s.days,0);
      if(nDays>0&&normal.length)perDay=nKm/nDays;             // baseline rutin (trip dikeluarkan)
    }
  }
  return {km,days,perDay,perMonth:perDay*30.4,perDayAll,perMonthAll:perDayAll*30.4,trips,thin,segCount:segs.length};
}

/* ---------- Skor Operasional (donat hibrida) ---------- */
const HEALTH_FUEL_W=0.6, HEALTH_SVC_W=0.4;            // bobot dua pilar
const FUEL_SRC_W={"Pertamina":1.0,"Shell":1.0,"Vivo":1.0,"BP-AKR":1.0,"SPBU":1.0,"Pom Mini":0.65}; // SPBU resmi=1.0, pom mini=0.65, manual/tak dikenal=0.25
const FUEL_SRC_DEF=0.25, HEALTH_WIN_DAYS=90, HEALTH_OVERDUE_WK=14;
function srcWeight(place){return FUEL_SRC_W[place]!=null?FUEL_SRC_W[place]:FUEL_SRC_DEF;}
function healthBand(s){return s>=85?{k:"Excellent",c:"var(--green)"}:s>=70?{k:"Stable",c:"var(--chart-svc)"}:s>=50?{k:"Warning",c:"var(--orange)"}:{k:"Risky",c:"var(--red)"};}

// Pilar 1 — kualitas bensin (jendela 90 hari bergulir)
function fuelQualityScore(v){
  const today=todayStr();
  const win=(v.fuelLog||[]).filter(p=>p.date&&diffDays(p.date,today)>=0&&diffDays(p.date,today)<=HEALTH_WIN_DAYS);
  if(!win.length)return null;
  const withL=win.filter(p=>p.liters>0).length;
  const useLiter=withL>=Math.ceil(win.length*0.6);     // mayoritas isi liter → timbang-liter, else timbang-jumlah
  let num=0,den=0,zH=0,zN=0,zR=0;
  win.forEach(p=>{
    const w=srcWeight(p.place), basis=useLiter?(p.liters>0?p.liters:0):1;
    if(basis<=0)return;
    num+=basis*w; den+=basis;
    if(w>=FUEL_SRC_W["SPBU"])zH+=basis*w; else if(w>FUEL_SRC_DEF)zN+=basis*w; else zR+=basis*w;
  });
  if(den<=0)return null;
  return {score:num/den*100, basis:useLiter?"liter":"jumlah", n:win.length, zH:zH/den*100, zN:zN/den*100, zR:zR/den*100};
}

// Pilar 2 — ketepatan servis (per pengingat berjadwal; KM→hari via laju robust)
function svcTimelinessScore(v){
  const d=vehicleDist(v), perDay=d&&d.perDay>0?d.perDay:0;
  const tracked=(v.reminders||[]).filter(r=>r.intervalKm>0||(r.intervalMonths>0&&r.baseDate));
  if(!tracked.length)return null;
  let sum=0,zH=0,zN=0,zR=0;
  tracked.forEach(r=>{
    const st=status(r,v.odo);
    let overdueDays=0,known=false;
    if(r.intervalMonths>0&&r.baseDate&&st.dateRem!=null){overdueDays=Math.max(overdueDays,st.dateRem<0?-st.dateRem:0);known=true;}
    if(r.intervalKm>0&&st.kmRem!=null){
      const kmOver=st.kmRem<0?-st.kmRem:0;
      if(kmOver>0){if(perDay>0){overdueDays=Math.max(overdueDays,kmOver/perDay);known=true;}}
      else known=true;
    }
    const ps=known?(overdueDays<=0?100:(overdueDays<=HEALTH_OVERDUE_WK?60:20))
                  :(st.sev===2?100:st.sev===1?60:20);   // fallback bila laju belum diketahui (reminder KM)
    sum+=ps;
    if(ps>=100)zH+=ps; else if(ps>=60)zN+=ps; else zR+=ps;
  });
  const n=tracked.length;
  return {score:sum/n, n, zH:zH/n, zN:zN/n, zR:zR/n};
}

// Komposit + pecahan zona (zona menjumlah tepat ke skor)
function operationalHealth(v){
  const fq=fuelQualityScore(v), st=svcTimelinessScore(v);
  if(!fq&&!st)return null;
  const parts=[];
  if(fq)parts.push({w:HEALTH_FUEL_W,o:fq});
  if(st)parts.push({w:HEALTH_SVC_W,o:st});
  const wsum=parts.reduce((a,p)=>a+p.w,0);
  let score=0,H=0,N=0,R=0;
  parts.forEach(p=>{const wn=p.w/wsum;score+=wn*p.o.score;H+=wn*p.o.zH;N+=wn*p.o.zN;R+=wn*p.o.zR;});
  return {score:Math.round(score),H,N,R,fq,st,band:healthBand(score)};
}

// Donat SVG: cincin terisi ke skor%, dipecah sub-busur hijau/kuning/merah (komposisi), sisa = jalur kosong
function healthDonut(oh){
  const C=314.159; // 2π·50
  let off=0,arcs="";
  [{v:oh.H,c:"var(--green)"},{v:oh.N,c:"var(--orange)"},{v:oh.R,c:"var(--red)"}].forEach(s=>{
    if(s.v<=0)return;
    const len=C*s.v/100;
    arcs+=`<circle cx="60" cy="60" r="50" fill="none" stroke="${s.c}" stroke-width="12" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
    off+=len;
  });
  return `<svg class="donut" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skor ${oh.score}%">
    <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="12"/>
    <g transform="rotate(-90 60 60)">${arcs}</g>
    <text x="60" y="58" text-anchor="middle" class="dval">${oh.score}%</text>
    <text x="60" y="76" text-anchor="middle" class="dband" fill="${oh.band.c}">${oh.band.k}</text>
  </svg>`;
}

function budgetCard(v){

}
function vehicleService(v){let count=0,cost=0,last=null;v.reminders.forEach(r=>r.logs.forEach(l=>{count++;cost+=l.cost||0;if(!last||l.date>last)last=l.date;}));return {count,cost,last};}
/* biaya per bulan (servis vs bensin), rentang kontinu dari bulan data pertama s/d bulan ini */
function spendMaps(v){
  const svc={},fuel={};
  v.reminders.forEach(r=>r.logs.forEach(l=>{if(l.cost>0){const k=l.date.slice(0,7);svc[k]=(svc[k]||0)+l.cost;}}));
  (v.fuelLog||[]).forEach(p=>{if(p.cost>0){const k=p.date.slice(0,7);fuel[k]=(fuel[k]||0)+p.cost;}});
  return {svc,fuel};
}
function monthlySpend(v){
  const {svc,fuel}=spendMaps(v);
  const keys=[...new Set([...Object.keys(svc),...Object.keys(fuel)])].sort();
  if(!keys.length)return [];
  let [y,m]=keys[0].split("-").map(Number);
  let end=monthKey(todayStr());if(end<keys[keys.length-1])end=keys[keys.length-1];
  const [ey,em]=end.split("-").map(Number);
  const out=[];let guard=0;
  while((y<ey||(y===ey&&m<=em))&&guard++<360){
    const k=`${y}-${String(m).padStart(2,"0")}`;
    out.push({key:k,year:y,month:m,svc:svc[k]||0,fuel:fuel[k]||0});
    m++;if(m>12){m=1;y++;}
  }
  return out;
}
function chartYears(v){return [...new Set(monthlySpend(v).map(d=>d.year))].sort();}
/* data chart sesuai scope: angka tahun (Jan–Des / s.d. bulan ini) atau "all" (rentang penuh) */
function rangeMonths(v,fromKey,toKey){
  const {svc,fuel}=spendMaps(v);
  let [y,m]=fromKey.split("-").map(Number);const [ey,em]=toKey.split("-").map(Number);
  const out=[];let g=0;
  while((y<ey||(y===ey&&m<=em))&&g++<480){const k=`${y}-${String(m).padStart(2,"0")}`;out.push({key:k,year:y,month:m,svc:svc[k]||0,fuel:fuel[k]||0});m++;if(m>12){m=1;y++;}}
  return out;
}

/* metrik bensin (tank-to-tank, toleran data parsial) */
function vehicleFuel(v){
  const f=(v.fuelLog||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.odo||0)-(b.odo||0));
  const base={count:f.length,totalCost:0,totalLiters:0,everyDays:null,costPerKm:null,kmPerL:null,perDayCost:null,perMonthCost:null,avgPerFill:null,avgLiters:null};
  if(!f.length)return base;
  const totalCost=f.reduce((s,x)=>s+(x.cost||0),0);
  const totalLiters=f.reduce((s,x)=>s+(x.liters||0),0);
  const spanDays=Math.max(0,diffDays(f[0].date,f[f.length-1].date));
  let everyDays=null;
  if(f.length>1){const ints=[];for(let i=1;i<f.length;i++){const dd=diffDays(f[i-1].date,f[i].date);if(dd>0)ints.push(dd);}everyDays=median(ints);}
  const avgPerFill=totalCost>0?totalCost/f.length:null;
  const avgLiters=totalLiters>0?totalLiters/f.length:null;
  const wo=f.filter(x=>x.odo>0);
  let costPerKm=null,kmPerL=null;
  if(wo.length>=2){
    const dist=Math.max(0,wo[wo.length-1].odo-wo[0].odo);
    if(dist>0){
      const after=wo.slice(1);
      const cAfter=after.reduce((s,x)=>s+(x.cost||0),0);
      const lAfter=after.reduce((s,x)=>s+(x.liters||0),0);
      if(cAfter>0)costPerKm=cAfter/dist;
      if(lAfter>0)kmPerL=dist/lAfter;
    }
  }
  const d=vehicleDist(v);
  let perDayCost=null;
  if(costPerKm!=null&&d)perDayCost=costPerKm*d.perDay;          // "smart": biaya/km × km/hari
  else if(spanDays>0)perDayCost=totalCost/spanDays;            // fallback kasar
  const perMonthCost=perDayCost!=null?perDayCost*30.4:null;
  return {count:f.length,totalCost,totalLiters,everyDays,costPerKm,kmPerL,perDayCost,perMonthCost,avgPerFill,avgLiters};
}

/* ---------- work order (sedang dikerjakan) ---------- */
function woFor(v,rid){return v?((v.workOrders||[]).find(w=>w.reminderId===rid)||null):null;}

/* ---------- kamus SPBU & BBM (default; tetap bisa diperluas manual via "Lainnya…") ----------
   place = merek SPBU, fuel = nama produk. t = label skala (RON/CN/Diesel) untuk bantu pilih. */
const SPBU_DICT=[
  {brand:"Pertamina",fuels:[
    {n:"Pertalite",t:"RON 90"},{n:"Pertamax",t:"RON 92"},{n:"Pertamax Green 95",t:"RON 95"},{n:"Pertamax Turbo",t:"RON 98"},
    {n:"BioSolar",t:"CN 48"},{n:"Dexlite",t:"CN 51"},{n:"Pertamina Dex",t:"CN 53"}]},
  {brand:"Shell",fuels:[
    {n:"Shell Super",t:"RON 92"},{n:"Shell V-Power",t:"RON 95"},{n:"Shell V-Power Nitro+",t:"RON 98"},
    {n:"Shell V-Power Diesel",t:"Diesel"},{n:"Shell Diesel Extra",t:"Diesel"}]},
  {brand:"Vivo",fuels:[
    {n:"Revvo 90",t:"RON 90"},{n:"Revvo 92",t:"RON 92"},{n:"Revvo 95",t:"RON 95"},
    {n:"Diesel Primus Plus",t:"Diesel"}]},
  {brand:"BP-AKR",fuels:[
    {n:"BP 92",t:"RON 92"},{n:"BP Ultimate",t:"RON 95"},{n:"BP Ultimate Diesel",t:"Diesel"}]},
  {brand:"Pom Mini",fuels:[
    {n:"Pertalite",t:"RON 90"},{n:"Pertamax",t:"RON 92"},{n:"Solar",t:"Diesel"}]}
];
const OTHER="Lainnya…"; // sentinel input manual (hybrid) — JANGAN dipakai sebagai nilai tersimpan
function brandList(){return SPBU_DICT.map(b=>b.brand);}
function fuelsForBrand(b){
  const hit=SPBU_DICT.find(x=>x.brand===b);
  if(hit)return hit.fuels;
  const seen=new Set(),out=[];          // brand kosong/custom → gabungan semua BBM (dedup nama)
  SPBU_DICT.forEach(x=>x.fuels.forEach(f=>{if(!seen.has(f.n)){seen.add(f.n);out.push(f);}}));
  return out;
}
function optBrand(sel){
  return `<option value="">— pilih SPBU —</option>`
    +brandList().map(b=>`<option value="${esc(b)}" ${sel===b?"selected":""}>${esc(b)}</option>`).join("")
    +`<option value="${OTHER}" ${sel===OTHER?"selected":""}>${OTHER}</option>`;
}
function optFuel(list,sel){
  return `<option value="">— pilih bensin —</option>`
    +list.map(f=>`<option value="${esc(f.n)}" ${sel===f.n?"selected":""}>${esc(f.n)}${f.t?" · "+esc(f.t):""}</option>`).join("")
    +`<option value="${OTHER}" ${sel===OTHER?"selected":""}>${OTHER}</option>`;
}

      <div class="fb-row"><span>Odometer terakhir</span><b>${nf(v.odo)} km</b></div>
      <div class="fb-row"><span>Rata-rata konsumsi</span><b>${kmpl!=null?kmpl.toFixed(1).replace(".",",")+" km/l":"—"}</b></div>

/* ---------- manual order ---------- */
function normalizeOrder(v){sortedReminders(v).forEach((r,i)=>r.order=i);}
function moveRem(v,id,dir){
  const arr=sortedReminders(v);const i=arr.findIndex(r=>r.id===id);const j=i+dir;
  if(j<0||j>=arr.length)return;
  [arr[i].order,arr[j].order]=[arr[j].order,arr[i].order];save();render();
}
function enableDrag(wrap,v){
  wrap.querySelectorAll("[data-handle]").forEach(h=>{
    let dragging=null;
    h.addEventListener("pointerdown",e=>{
      e.preventDefault();
      dragging=h.closest(".rem");dragging.classList.add("dragging");
      try{h.setPointerCapture(e.pointerId);}catch(_){}
    });
    h.addEventListener("pointermove",e=>{
      if(!dragging)return;
      const el=document.elementFromPoint(e.clientX,e.clientY);
      const over=el&&el.closest?el.closest(".rem"):null;
      if(over&&over!==dragging&&over.parentNode===wrap){
        const rect=over.getBoundingClientRect();
        wrap.insertBefore(dragging, e.clientY>rect.top+rect.height/2 ? over.nextSibling : over);
      }
    });
    const end=()=>{
      if(!dragging)return;dragging.classList.remove("dragging");
      [...wrap.children].forEach((c,i)=>{const r=v.reminders.find(x=>x.id===c.dataset.id);if(r)r.order=i;});
      dragging=null;save();render();
    };
    h.addEventListener("pointerup",end);
    h.addEventListener("pointercancel",end);
  });
}

      state.vehicles.push(v);state.selected=v.id;save();render();closeSheet();toast("Kendaraan ditambahkan");
    }
  };
}
function odoModal(){
  const v=vehicle();
  openSheet(`<h3>🔢 Update Odometer</h3>
    <div class="field"><label>Odometer terkini — ${esc(v.name)} (km)</label><input id="oi" inputmode="numeric" value="${v.odo}">
    <div class="hint">Semua sisa km dihitung ulang otomatis.</div></div>
    <div class="row"><button class="btn ghost" id="c">Batal</button><button class="btn primary" id="ok">Simpan</button></div>`);
  const oi=$("#oi");oi.focus();oi.select();$("#c").onclick=closeSheet;
  $("#ok").onclick=()=>{const val=clean(oi.value);
    if(val<v.odo){confirmBox("Odometer turun?",`Angka baru (${nf(val)}) lebih kecil dari sebelumnya (${nf(v.odo)}). Tetap simpan?`,()=>{v.odo=val;save();render();closeSheet();toast("Odometer diperbarui");});return;}
    v.odo=val;save();render();closeSheet();toast("Odometer diperbarui");};
}

/* ---------- add / edit reminder (shared form) ---------- */
function reminderModal(editId,prefill){
  const v=vehicle();const r=editId?findRem(editId):null;const isEdit=!!r;const P=prefill||{};
  const initName=isEdit?r.name:(P.name||"");
  const initCat=isEdit?r.category:(P.category||"");
  const initIk=isEdit?(r.intervalKm||""):(P.intervalKm||"");
  const initIm=isEdit?(r.intervalMonths||""):(P.intervalMonths||"");
  const hasLogs=isEdit&&Array.isArray(r.logs)&&r.logs.length>0;
  const initBo=isEdit?(r.initOdo!=null?r.initOdo:r.baseOdo):v.odo;
  const initBd=(isEdit&&r.initDate)?r.initDate:(P.baseDate||todayStr());
  openSheet(`<h3>${isEdit?"✏️ Edit Pengingat":"🔔 Pengingat Baru"}</h3>
    <div class="field" id="fName"><label>Nama pengingat</label><input id="rn" placeholder="cth: Oli Mesin, Ganti Ban" autocomplete="off" value="${esc(initName)}"><div class="err">Nama tidak boleh kosong.</div></div>
    <div class="field"><label>Kategori (opsional — bantu auto-urut prioritas)</label><select id="rc">${catOptions(initCat,v)}</select><div class="hint">Kosongkan saja kalau ragu; app menebak prioritas dari nama.</div></div>
    <div class="two">
      <div class="field"><label>Interval km</label><input id="rik" inputmode="numeric" placeholder="cth: 2000" value="${initIk}"></div>
      <div class="field"><label>Interval bulan</label><input id="rim" inputmode="numeric" placeholder="cth: 2" value="${initIm}"></div>
    </div>
    <div class="field" id="fInt"><div class="err">Isi minimal salah satu: interval km atau bulan.</div></div>
    <div class="two">
      <div class="field" id="fBo"><label>${hasLogs?"Anchor awal — odometer":"Terakhir diganti — odometer"}</label><input id="rbo" inputmode="numeric" value="${initBo}"><div class="err"></div></div>
      <div class="field" id="fBd"><label>${hasLogs?"Anchor awal — tanggal":"Terakhir diganti — tanggal"}</label><input id="rbd" type="date" value="${initBd}"><div class="err"></div></div>
    </div>
    <div class="hint" style="margin:-6px 0 14px">${hasLogs?"Acuan jatuh tempo diambil dari servis <b>terbaru di Riwayat</b>. Kolom ini cuma anchor cadangan bila seluruh Riwayat dikosongkan.":"Default = kondisi sekarang. Tanggal hanya dipakai jika interval bulan diisi."}</div>
    <div class="row"><button class="btn ghost" id="c">Batal</button><button class="btn primary" id="ok">${isEdit?"Simpan Perubahan":"Simpan"}</button></div>`);
  const rn=$("#rn");if(!isEdit)rn.focus();$("#c").onclick=()=>isEdit?detailSheet(editId):closeSheet();
  $("#ok").onclick=()=>{
    const name=rn.value.trim();const ik=clean($("#rik").value);const im=clean($("#rim").value);
    const bo=clean($("#rbo").value);const bd=$("#rbd").value||todayStr();
    let ok=true;
    $("#fName").classList.toggle("bad",!name);if(!name)ok=false;
    $("#fInt").classList.toggle("bad",ik<=0&&im<=0);if(ik<=0&&im<=0)ok=false;
    // BLOK: mustahil (hanya relevan untuk anchor; saat ada Riwayat, acuan diambil dari log)
    const fBo=$("#fBo"),fBd=$("#fBd");fBo.classList.remove("bad");fBd.classList.remove("bad");
    if(!hasLogs){
      if(bo>v.odo){fBo.classList.add("bad");fBo.querySelector(".err").textContent=`Tidak boleh lebih dari odometer kendaraan (${nf(v.odo)} km).`;ok=false;}
      if(im>0&&diffDays(todayStr(),bd)>0){fBd.classList.add("bad");fBd.querySelector(".err").textContent="Tanggal tidak boleh di masa depan.";ok=false;}
    }
    if(!ok)return;
    // TEGUR: mencurigakan (langsung lewat) — hanya untuk pengingat tanpa Riwayat
    const overKm=!hasLogs&&ik>0&&(bo+ik)<=v.odo;
    const overDate=!hasLogs&&im>0&&diffDays(addMonths(bd,im),todayStr())>0;
    const apply=()=>{
      if(isEdit){
        r.name=name;r.category=$("#rc").value||null;r.intervalKm=ik;r.intervalMonths=im;
        if(!hasLogs){r.initOdo=bo;r.initDate=im>0?bd:(ik>0?null:bd);}
        recomputeBase(r);
      }else{
        const nr={id:uid(),name,category:$("#rc").value||null,intervalKm:ik,intervalMonths:im,initOdo:bo,initDate:im>0?bd:null,baseOdo:bo,baseDate:im>0?bd:null,pinned:false,order:v.reminders.length,logs:[]};
        recomputeBase(nr);v.reminders.push(nr);
      }
      save();render();toast(isEdit?"Pengingat diperbarui":"Pengingat ditambahkan");
      if(isEdit)detailSheet(editId);else closeSheet();
    };
    if(overKm||overDate){
      let msg="Pengaturan ini membuat pengingat langsung berstatus lewat jatuh tempo";
      if(overKm)msg+=` (lewat ${nf(v.odo-(bo+ik))} km)`;
      confirmBox("Langsung lewat tempo?",msg+". Yakin angkanya benar?",apply,"Ya, simpan");
    }else apply();
  };
}

/* ---------- catat servis ---------- */
function serviceModal(id,returnDetail,afterCommit){
  const v=vehicle();const r=findRem(id);
  openSheet(`<h3>🛠️ Catat Servis · ${esc(r.name)}</h3>
    <div class="two">
      <div class="field"><label>Tanggal servis</label><input id="sd" type="date" value="${todayStr()}"></div>
      <div class="field"><label>Odometer (km)</label><input id="so" inputmode="numeric" value="${v.odo}"></div>
    </div>
    <div class="field"><label>Biaya (opsional, Rp)</label><input id="sc" inputmode="numeric" placeholder="cth: 65000"></div>
    <div class="field"><label>Catatan (opsional)</label><textarea id="sn" placeholder="cth: Bengkel AHASS Jl. Merdeka, pakai oli MPX2, sekalian cek rem"></textarea></div>
    <div class="hint" style="margin-top:-6px;margin-bottom:14px">Menyimpan ini akan mereset hitungan km & tanggal untuk siklus berikutnya, dan masuk ke Riwayat.</div>
    <div class="row"><button class="btn ghost" id="c">Batal</button><button class="btn primary" id="ok">Simpan Servis</button></div>`);
  $("#c").onclick=()=>returnDetail?detailSheet(id):closeSheet();
  $("#ok").onclick=()=>{
    const sd=$("#sd").value||todayStr();const so=clean($("#so").value);const sc=clean($("#sc").value);const sn=$("#sn").value.trim();
    if(diffDays(todayStr(),sd)>0){toast("Tanggal servis tidak boleh di masa depan");return;}
    const commit=()=>{
      const stale=isStale(r,sd);                       // ada servis lebih baru? → tak menggeser siklus
      r.logs.unshift({id:uid(),date:sd,odo:so,cost:sc,note:sn});
      recomputeBase(r);                                // acuan siklus = peristiwa terbaru di Riwayat
      if(typeof afterCommit==="function")afterCommit();
      save();render();
      toast(stale?"Servis lama disimpan ke Riwayat (siklus berjalan tetap)":"Servis dicatat ✓");
      if(returnDetail)detailSheet(id);else closeSheet();
    };
    if(so>v.odo){
      confirmBox("Perbarui odometer kendaraan?",`Odometer servis (${nf(so)}) lebih tinggi dari odometer kendaraan saat ini (${nf(v.odo)}). Perbarui odometer kendaraan ke ${nf(so)} juga?`,
        ()=>{v.odo=so;commit();},"Ya, perbarui",{noLabel:"Tidak, simpan saja",onNo:commit});
      return;
    }
    commit();
  };
}

/* ---------- detail sheet (show detail lengkap) ---------- */
function detailSheet(id){
  const v=vehicle();const r=findRem(id);if(!r)return closeSheet();
  const st=status(r,v.odo);
  const col=st.sName==="danger"?"var(--red)":st.sName==="warn"?"var(--orange)":"var(--green)";
  const rules=[];
  if(r.intervalKm>0)rules.push(nf(r.intervalKm)+" km");
  if(r.intervalMonths>0)rules.push(r.intervalMonths+" bulan");
  const dueKm=st.dueOdo!=null?`<div class="dt-cell"><div class="k">Jatuh tempo · KM</div><div class="v">${nf(st.dueOdo)} km<small>${st.kmRem>0?"sisa "+nf(st.kmRem)+" km":"lewat "+nf(-st.kmRem)+" km"}</small></div></div>`:"";
  const dueDt=st.dueDate!=null?`<div class="dt-cell"><div class="k">Jatuh tempo · Tanggal</div><div class="v">${fmtD(st.dueDate)}<small>${st.dateRem>0?"sisa "+st.dateRem+" hari":"lewat "+(-st.dateRem)+" hari"}</small></div></div>`:"";

  const logs=r.logs.length?r.logs.map(l=>`
    <div class="logitem" data-log="${l.id}">
      <div class="lh"><span class="ldate">${fmtDLong(l.date)}</span><span class="lodo">${nf(l.odo)} km</span></div>
      ${l.cost?`<div class="lcost">Rp ${nf(l.cost)}</div>`:""}
      ${l.note?`<div class="lnote">${esc(l.note)}</div>`:""}
      <div class="lact"><button data-le="${l.id}">Edit</button><button class="x" data-lx="${l.id}">Hapus</button></div>
    </div>`).join(""):`<div class="emptylog">Belum ada riwayat servis. Tekan "Catat Servis" setelah servis dilakukan.</div>`;

  openSheet(`
    <div class="dt-head"><h3 style="margin:0">${r.pinned?'<span class="pinmark">📌</span> ':""}${esc(r.name)}</h3>
      <span class="badge" style="color:${col};background:rgba(255,255,255,.06)">${st.label}</span></div>
    <span class="meta" style="font-family:var(--mono);font-size:11.5px;color:var(--faint)">Interval: ${rules.join(" / ")||"—"}${r.category?" · "+esc(r.category)+" (Tier "+tierOf(r,v)+")":" · prioritas Tier "+tierOf(r,v)}</span>
    <div class="dt-grid">
      <div class="dt-cell"><div class="k">Terakhir diganti · KM</div><div class="v">${nf(r.baseOdo)} km</div></div>
      <div class="dt-cell"><div class="k">Terakhir diganti · Tgl</div><div class="v">${fmtD(r.baseDate)}</div></div>
      ${dueKm}${dueDt}
    </div>
    <div class="bar"><i style="width:${st.pct}%;background:${col}"></i></div>
    <div class="row" style="margin:14px 0 10px">
      <button class="btn primary" id="dDone">🛠️ Catat Servis</button>
      <button class="btn ghost" id="dEdit">✏️ Edit</button>
    </div>
    <button class="mini ${woFor(v,id)?"":"go"}" id="dWO" style="margin:0 0 18px;display:block;width:100%;padding:11px">${woFor(v,id)?"✓ Selesaikan pekerjaan":"🔧 Tandai sedang dikerjakan"}</button>
    <h2 style="font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin:0 0 12px">Riwayat Servis (${r.logs.length})</h2>
    ${logs}
    <button class="mini" id="dDel" style="margin:18px auto 4px;display:block;color:var(--red);border-color:rgba(255,93,82,.25);padding:9px 14px">Hapus pengingat ini</button>
    <div class="row" style="margin-top:14px"><button class="btn ghost" id="dClose">Tutup</button></div>`);
  $("#dClose").onclick=closeSheet;
  $("#dDone").onclick=()=>serviceModal(id,true);
  $("#dWO").onclick=()=>{const w=woFor(v,id);if(w){closeSheet();finishWO(state.selected,w.id);}else{startWO(state.selected,id);closeSheet();}};
  $("#dEdit").onclick=()=>reminderModal(id);
  $("#dDel").onclick=()=>confirmBox("Hapus pengingat?",`"${r.name}" beserta ${r.logs.length} riwayatnya akan dihapus.`,()=>{
    v.reminders=v.reminders.filter(x=>x.id!==id);save();render();closeSheet();toast("Pengingat dihapus");},"Ya, hapus");
  r.logs.forEach(l=>{
    $("#sheet").querySelector(`[data-lx="${l.id}"]`).onclick=()=>confirmBox("Hapus catatan servis?",`Entri ${fmtD(l.date)} akan dihapus.`,()=>{
      r.logs=r.logs.filter(x=>x.id!==l.id);recomputeBase(r);save();render();detailSheet(id);toast("Catatan dihapus");},"Ya, hapus");
    $("#sheet").querySelector(`[data-le="${l.id}"]`).onclick=()=>logEditModal(id,l.id);
  });
}

function logEditModal(rid,lid){
  const r=findRem(rid);const l=r.logs.find(x=>x.id===lid);if(!l)return;
  openSheet(`<h3>✏️ Edit Catatan Servis</h3>
    <div class="two"><div class="field"><label>Tanggal</label><input id="ed" type="date" value="${l.date}"></div>
      <div class="field"><label>Odometer (km)</label><input id="eo" inputmode="numeric" value="${l.odo}"></div></div>
    <div class="field"><label>Biaya (Rp)</label><input id="ec" inputmode="numeric" value="${l.cost||""}"></div>
    <div class="field"><label>Catatan</label><textarea id="en">${esc(l.note||"")}</textarea></div>
    <div class="hint" style="margin-top:-6px;margin-bottom:14px">Mengedit entri terbaru otomatis memperbarui acuan hitung berjalan (jatuh tempo km & tanggal).</div>
    <div class="row"><button class="btn ghost" id="c">Batal</button><button class="btn primary" id="ok">Simpan</button></div>`);
  $("#c").onclick=()=>detailSheet(rid);
  $("#ok").onclick=()=>{const d=$("#ed").value||l.date;
    if(diffDays(todayStr(),d)>0){toast("Tanggal tidak boleh di masa depan");return;}
    l.date=d;l.odo=clean($("#eo").value);l.cost=clean($("#ec").value);l.note=$("#en").value.trim();
    recomputeBase(r);
    save();render();detailSheet(rid);toast("Catatan diperbarui");};
}

/* ---------- vehicle delete ---------- */
function delVehicle(id){
  const v=state.vehicles.find(x=>x.id===id);if(!v)return;
  confirmBox("Hapus kendaraan?",`"${v.name}" beserta semua pengingat & riwayatnya akan dihapus.`,()=>{
    state.vehicles=state.vehicles.filter(x=>x.id!==id);
    state.selected=state.vehicles[0]?state.vehicles[0].id:null;save();render();toast("Kendaraan dihapus");},"Ya, hapus");
}

/* ---------- menu / export / import ---------- */
$("#menuBtn").onclick=()=>{
  openSheet(`<h3 style="margin-bottom:6px">Menu</h3>
    <button class="menu-item" id="exp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span>Export data (backup)<small>Simpan semua data ke file .json</small></span></button>
    <button class="menu-item" id="imp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span>Import data<small>Pulihkan dari file backup .json</small></span></button>
    <button class="menu-item" id="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span>Tentang & tips backup<small>Kenapa export rutin itu penting</small></span></button>`);
  $("#exp").onclick=()=>{closeSheet();doExport();};
  $("#imp").onclick=()=>{closeSheet();$("#fileInput").click();};
  $("#about").onclick=()=>{closeSheet();aboutModal();};
};
function doExport(){
  const data=JSON.stringify({app:"garasi-log",version:7,exportedAt:new Date().toISOString(),state},null,2);
  const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
  const d=new Date();const stamp=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  const a=document.createElement("a");a.href=url;a.download=`garasi-log-${stamp}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Backup diunduh");
}
$("#fileInput").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{
    const obj=JSON.parse(rd.result);
    const inc=obj.state&&Array.isArray(obj.state.vehicles)?obj.state:(Array.isArray(obj.vehicles)?obj:null);
    if(!inc)throw 0;const n=inc.vehicles.length;
    confirmBox("Ganti semua data?",`File berisi ${n} kendaraan. Data saat ini akan diganti seluruhnya.`,()=>{
      state=migrate(inc);save();render();toast(`Berhasil impor ${n} kendaraan`);},"Ya, ganti");
  }catch(err){toast("File tidak valid / bukan backup Garasi Log");}finally{e.target.value="";}};
  rd.readAsText(f);
});
function aboutModal(){
  openSheet(`<h3>ℹ️ Tentang Garasi Log</h3>
    <p style="color:var(--muted);font-size:13.5px;line-height:1.6;margin:-4px 0 14px">Aplikasi offline. Semua data disimpan <b style="color:var(--text)">di perangkat ini saja</b> — tidak ada server, tidak dikirim ke mana pun.</p>
    <p style="color:var(--muted);font-size:13.5px;line-height:1.6;margin:0 0 16px">⚠️ Data bisa hilang jika kamu menghapus data situs. Biasakan <b style="color:var(--amber)">Export backup</b> rutin lalu simpan file .json-nya di Google Drive.</p>
    <p style="color:var(--faint);font-size:12px;margin:0 0 16px">Versi 4 · papan kerja + catat cepat bensin/odometer per kendaraan, profil per kendaraan, telemetri jarak & bensin (tank-to-tank) dengan baseline harian robust, deteksi perjalanan jauh, servis mendatang di beranda, dan grafik biaya bulanan (servis vs bensin) dengan arsip per tahun. Tetap kompatibel impor backup lama.</p>
    <div class="row"><button class="btn primary" id="c">Mengerti</button></div>`);
  $("#c").onclick=closeSheet;
}

/* ---------- toast ---------- */
let tT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),2600);}

/* ---------- PWA ---------- */
let dp=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;if(!localStorage.getItem("install-dismissed"))$("#install").classList.add("show");});
$("#installBtn").onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$("#install").classList.remove("show");};
$("#installX").onclick=()=>{$("#install").classList.remove("show");localStorage.setItem("install-dismissed","1");};
window.addEventListener("appinstalled",()=>{$("#install").classList.remove("show");toast("Terpasang ✓");});
async function initStorage(){try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist();}catch(e){}}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));

/* ---------- boot ---------- */
load();render();initStorage();
</script>
