<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garasi Log</title>
<meta name="description" content="Catatan servis kendaraan & pengingat ganti oli berbasis odometer. Offline, gratis, datamu milikmu.">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#14110d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Garasi">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-48.png">
<style>
  :root{
    --bg:#14110d; --bg2:#1b1711; --panel:#211c14; --panel2:#2a241a;
    --line:rgba(255,210,140,.10); --line2:rgba(255,210,140,.16);
    --text:#f3ecdd; --muted:#9c917d; --faint:#6f6453;
    --amber:#ffc454; --amber-dim:#caa04a;
    --green:#41d97f; --orange:#ff9d2e; --red:#ff5d52;
    --shadow:0 18px 40px -18px rgba(0,0,0,.8);
    --mono:ui-monospace,"Roboto Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--sans); color:var(--text); background:var(--bg);
    background-image:
      radial-gradient(1200px 500px at 50% -10%, rgba(255,180,80,.10), transparent 60%),
      radial-gradient(700px 400px at 90% 110%, rgba(255,120,40,.06), transparent 60%);
    background-attachment:fixed;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

  /* Header */
  header{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px 14px;
    background:linear-gradient(var(--bg) 60%, rgba(20,17,13,.4));
    backdrop-filter:blur(6px);
  }
  .brand{display:flex;align-items:center;gap:11px}
  .logo{
    width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 35%, #2b241a, #15110c);
    border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,200,120,.12);
  }
  .logo svg{width:24px;height:24px}
  .brand h1{
    font-family:var(--mono);font-size:15px;letter-spacing:.32em;margin:0;
    text-transform:uppercase;font-weight:600;color:var(--text);
  }
  .brand small{display:block;font-size:9.5px;letter-spacing:.34em;color:var(--faint);margin-top:2px}
  .iconbtn{
    background:var(--panel);border:1px solid var(--line);color:var(--muted);
    width:40px;height:40px;border-radius:11px;display:grid;place-items:center;cursor:pointer;
    transition:.18s;
  }
  .iconbtn:active{transform:scale(.93)}
  .iconbtn svg{width:20px;height:20px}

  /* Vehicle chips */
  .vbar{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 14px;scrollbar-width:none}
  .vbar::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);padding:9px 15px;border-radius:99px;font-size:13.5px;
    font-weight:600;cursor:pointer;transition:.18s;white-space:nowrap;
    display:flex;align-items:center;gap:7px;
  }
  .chip:active{transform:scale(.96)}
  .chip.active{
    color:#1a140a;background:linear-gradient(180deg,#ffce6e,#f5a623);
    border-color:transparent;box-shadow:0 6px 16px -6px rgba(245,166,35,.6);
  }
  .chip.add{color:var(--amber);border-style:dashed;border-color:var(--line2);background:transparent}

  main{flex:1;padding:0 18px 120px}

  /* Odometer panel */
  .odo{
    position:relative;border:1px solid var(--line2);border-radius:20px;
    background:linear-gradient(160deg,#241e15,#17130d);box-shadow:var(--shadow);
    padding:20px 20px 18px;margin-bottom:18px;overflow:hidden;
  }
  .odo::before{content:"";position:absolute;inset:0;
    background:radial-gradient(420px 120px at 30% 0%, rgba(255,196,84,.12),transparent 70%);pointer-events:none}
  .odo .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;color:var(--faint);text-transform:uppercase}
  .readout{display:flex;align-items:baseline;gap:10px;margin-top:8px}
  .readout .num{
    font-family:var(--mono);font-weight:700;font-size:clamp(40px,12vw,58px);line-height:1;
    color:var(--amber);text-shadow:0 0 22px rgba(255,196,84,.35);letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
  }
  .readout .unit{font-family:var(--mono);font-size:16px;color:var(--amber-dim);letter-spacing:.15em}
  .odo .editbtn{
    position:absolute;top:16px;right:16px;font-family:var(--mono);font-size:11px;
    letter-spacing:.12em;color:var(--amber);background:rgba(255,196,84,.08);
    border:1px solid var(--line2);padding:7px 12px;border-radius:9px;cursor:pointer;
    display:flex;align-items:center;gap:6px;text-transform:uppercase;
  }
  .odo .editbtn:active{transform:scale(.95)}

  /* Section title */
  .sect{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 12px}
  .sect h2{font-family:var(--mono);font-size:11px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;margin:0;font-weight:600}
  .sect .count{font-family:var(--mono);font-size:11px;color:var(--faint)}

  /* Reminder card */
  .rem{
    border:1px solid var(--line);border-radius:16px;background:var(--panel);
    padding:15px 16px 14px;margin-bottom:12px;position:relative;overflow:hidden;
  }
  .rem .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px}
  .rem .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .rem .name{font-size:16px;font-weight:700;margin:0 0 3px;color:var(--text)}
  .rem .meta{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.04em}
  .badge{
    font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;
    padding:5px 9px;border-radius:8px;text-transform:uppercase;white-space:nowrap;flex:0 0 auto;
  }
  .bar{height:9px;border-radius:99px;background:rgba(255,255,255,.06);margin:13px 0 9px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
  .rem .foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .rem .rest{font-size:13px;color:var(--muted)}
  .rem .rest b{font-family:var(--mono);color:var(--text);font-size:15px}
  .rem .acts{display:flex;gap:8px}
  .mini{
    font-size:12px;font-weight:600;border-radius:9px;padding:8px 11px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel2);color:var(--muted);transition:.15s;
  }
  .mini:active{transform:scale(.94)}
  .mini.go{color:var(--green);border-color:rgba(65,217,127,.3)}
  .mini.del{color:var(--red);border-color:rgba(255,93,82,.25);padding:8px 10px}

  /* status colors */
  .s-safe{--c:var(--green)} .s-warn{--c:var(--orange)} .s-danger{--c:var(--red)}
  .s-safe .stripe,.s-warn .stripe,.s-danger .stripe{background:var(--c);box-shadow:0 0 14px -2px var(--c)}
  .s-safe .bar>i,.s-warn .bar>i,.s-danger .bar>i{background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 60%, #fff 0%))}
  .s-safe .badge{color:var(--green);background:rgba(65,217,127,.12)}
  .s-warn .badge{color:var(--orange);background:rgba(255,157,46,.12)}
  .s-danger .badge{color:var(--red);background:rgba(255,93,82,.14)}

  .addrem{
    width:100%;border:1px dashed var(--line2);background:transparent;color:var(--amber);
    border-radius:14px;padding:14px;font-size:14px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px;transition:.15s;
  }
  .addrem:active{transform:scale(.98)}

  /* Empty states */
  .empty{text-align:center;padding:54px 24px;color:var(--muted)}
  .empty .big{width:72px;height:72px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 35%,#2b241a,#15110c);border:1px solid var(--line2)}
  .empty .big svg{width:42px;height:42px}
  .empty h3{margin:0 0 6px;font-size:18px;color:var(--text)}
  .empty p{margin:0 auto 22px;max-width:300px;font-size:14px;line-height:1.55}
  .cta{
    background:linear-gradient(180deg,#ffce6e,#f5a623);color:#1a140a;border:none;
    padding:13px 22px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
    box-shadow:0 10px 24px -8px rgba(245,166,35,.55);
  }
  .cta:active{transform:scale(.97)}

  /* Modal */
  .scrim{position:fixed;inset:0;background:rgba(8,6,3,.72);backdrop-filter:blur(3px);
    z-index:50;display:none;align-items:flex-end;justify-content:center}
  .scrim.show{display:flex}
  .sheet{
    width:100%;max-width:560px;background:var(--bg2);border:1px solid var(--line2);
    border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    box-shadow:0 -20px 50px -10px rgba(0,0,0,.7);animation:up .28s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
  .sheet h3{margin:0 0 16px;font-size:18px;display:flex;align-items:center;gap:9px}
  .field{margin-bottom:14px}
  .field label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    color:var(--muted);text-transform:uppercase;margin-bottom:7px}
  .field input{
    width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--text);
    border-radius:12px;padding:13px 14px;font-size:16px;font-family:var(--sans);outline:none;transition:.15s;
  }
  .field input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,196,84,.13)}
  .field .hint{font-size:11.5px;color:var(--faint);margin-top:6px}
  .row{display:flex;gap:10px;margin-top:6px}
  .btn{flex:1;padding:14px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;border:1px solid var(--line2)}
  .btn.ghost{background:transparent;color:var(--muted)}
  .btn.primary{background:linear-gradient(180deg,#ffce6e,#f5a623);color:#1a140a;border:none;
    box-shadow:0 8px 20px -8px rgba(245,166,35,.5)}
  .btn:active{transform:scale(.97)}
  .menu-item{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    background:transparent;border:none;color:var(--text);padding:15px 6px;font-size:15px;cursor:pointer;
    border-bottom:1px solid var(--line)}
  .menu-item:last-child{border-bottom:none}
  .menu-item svg{width:21px;height:21px;color:var(--amber);flex:0 0 auto}
  .menu-item small{display:block;color:var(--faint);font-size:12px;margin-top:2px}

  /* Toast */
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#2c2519;border:1px solid var(--line2);color:var(--text);padding:12px 18px;
    border-radius:12px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:.25s;
    box-shadow:var(--shadow);max-width:90%}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* install banner */
  #install{display:none;margin:0 18px 14px;align-items:center;gap:12px;
    background:linear-gradient(160deg,#241e15,#1a160f);border:1px solid var(--line2);
    border-radius:14px;padding:12px 14px}
  #install.show{display:flex}
  #install p{margin:0;font-size:13px;color:var(--muted);flex:1;line-height:1.4}
  #install b{color:var(--text)}
  #install button{background:var(--amber);color:#1a140a;border:none;padding:9px 14px;border-radius:9px;
    font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
  #install .x{background:transparent;color:var(--faint);padding:8px;font-size:18px;border:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3a9 9 0 0 0-9 9 9 9 0 0 0 .35 2.5h17.3A9 9 0 0 0 21 12a9 9 0 0 0-9-9Z" stroke="#ffc454" stroke-width="1.4"/><path d="M12 12l4.5-3" stroke="#ffc454" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="1.6" fill="#ffc454"/></svg>
      </div>
      <div><h1>GARASI</h1><small>VEHICLE LOG</small></div>
    </div>
    <button class="iconbtn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
    </button>
  </header>

  <div class="vbar" id="vbar"></div>

  <div id="install">
    <p><b>Pasang ke layar utama</b><br>Akses cepat seperti aplikasi biasa.</p>
    <button id="installBtn">Pasang</button>
    <button class="x" id="installX" aria-label="Tutup">&times;</button>
  </div>

  <main id="main"></main>
</div>

<!-- Modal host -->
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<input type="file" id="fileInput" accept="application/json,.json" style="display:none">

<script>
"use strict";
const KEY="garasi-log-v1";
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nf=n=>Number(n||0).toLocaleString("id-ID");
const clean=v=>{const n=parseInt(String(v).replace(/[^\d]/g,""),10);return isNaN(n)?0:n;};

let state={vehicles:[],selected:null};

/* ---------- storage ---------- */
function load(){
  try{const r=localStorage.getItem(KEY);if(r)state=JSON.parse(r);}catch(e){console.warn("load gagal",e);}
  if(!state||typeof state!=="object")state={vehicles:[],selected:null};
  if(!Array.isArray(state.vehicles))state.vehicles=[];
  if(!state.selected||!state.vehicles.some(v=>v.id===state.selected))
    state.selected=state.vehicles[0]?state.vehicles[0].id:null;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast("Gagal menyimpan data");}}
const vehicle=()=>state.vehicles.find(v=>v.id===state.selected)||null;

/* ---------- status logic ---------- */
function status(rem,odo){
  const due=rem.base+rem.interval;
  const remaining=due-odo;
  const used=Math.max(0,odo-rem.base);
  const pct=Math.min(100,Math.max(0,(used/rem.interval)*100));
  const threshold=Math.max(rem.interval*0.1,100);
  let s="safe",label="AMAN";
  if(remaining<=0){s="danger";label="HARUS GANTI";}
  else if(remaining<=threshold){s="warn";label="SEGERA";}
  return {due,remaining,pct,s,label};
}

/* ---------- render ---------- */
function render(){renderChips();renderMain();}

function renderChips(){
  const bar=$("#vbar");bar.innerHTML="";
  state.vehicles.forEach(v=>{
    const c=document.createElement("button");
    c.className="chip"+(v.id===state.selected?" active":"");
    c.textContent=v.name;
    c.onclick=()=>{state.selected=v.id;save();render();};
    bar.appendChild(c);
  });
  const add=document.createElement("button");
  add.className="chip add";add.innerHTML="＋ Kendaraan";
  add.onclick=()=>vehicleModal();
  bar.appendChild(add);
}

function renderMain(){
  const m=$("#main");m.innerHTML="";
  const v=vehicle();
  if(!v){
    m.innerHTML=`<div class="empty">
      <div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="#ffc454" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6.5 17l1-5.2a2 2 0 0 1 2-1.8h5a2 2 0 0 1 2 1.8l1 5.2"/><path d="M4 17v2M20 17v2"/><circle cx="8" cy="17" r="1.2"/><circle cx="16" cy="17" r="1.2"/></svg></div>
      <h3>Belum ada kendaraan</h3>
      <p>Tambahkan kendaraan pertamamu untuk mulai mencatat odometer dan pengingat servis.</p>
      <button class="cta" id="firstAdd">＋ Tambah Kendaraan</button>
    </div>`;
    $("#firstAdd").onclick=()=>vehicleModal();
    return;
  }

  // odometer
  const odo=document.createElement("div");
  odo.className="odo";
  odo.innerHTML=`
    <div class="lbl">Odometer · ${v.name}</div>
    <div class="readout"><span class="num">${nf(v.odo)}</span><span class="unit">KM</span></div>
    <button class="editbtn" id="editOdo">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      Ubah
    </button>`;
  m.appendChild(odo);
  odo.querySelector("#editOdo").onclick=()=>odoModal();

  // reminders header
  const sect=document.createElement("div");
  sect.className="sect";
  sect.innerHTML=`<h2>Pengingat Servis</h2><span class="count">${v.reminders.length} item</span>`;
  m.appendChild(sect);

  if(v.reminders.length===0){
    const e=document.createElement("div");
    e.className="empty";e.style.padding="26px 10px";
    e.innerHTML=`<p style="margin-bottom:16px">Belum ada pengingat. Tambahkan misalnya "Ganti Oli" tiap 2.000 km.</p>`;
    m.appendChild(e);
  }

  // sort: most urgent first
  const sorted=[...v.reminders].sort((a,b)=>status(a,v.odo).remaining-status(b,v.odo).remaining);
  sorted.forEach(r=>{
    const st=status(r,v.odo);
    const card=document.createElement("div");
    card.className="rem s-"+st.s;
    const restTxt=st.remaining>0
      ? `Sisa <b>${nf(st.remaining)}</b> km`
      : `Lewat <b>${nf(-st.remaining)}</b> km`;
    card.innerHTML=`
      <span class="stripe"></span>
      <div class="top">
        <div>
          <p class="name">${esc(r.name)}</p>
          <span class="meta">Tiap ${nf(r.interval)} km · jatuh tempo ${nf(st.due)} km</span>
        </div>
        <span class="badge">${st.label}</span>
      </div>
      <div class="bar"><i style="width:${st.pct}%"></i></div>
      <div class="foot">
        <span class="rest">${restTxt}</span>
        <div class="acts">
          <button class="mini go">✓ Sudah diganti</button>
          <button class="mini del" aria-label="Hapus">🗑</button>
        </div>
      </div>`;
    card.querySelector(".go").onclick=()=>markDone(r.id);
    card.querySelector(".del").onclick=()=>delReminder(r.id);
    m.appendChild(card);
  });

  const add=document.createElement("button");
  add.className="addrem";add.innerHTML="＋ Tambah Pengingat";
  add.onclick=()=>reminderModal();
  m.appendChild(add);

  // danger zone: delete vehicle
  const dv=document.createElement("button");
  dv.className="mini del";dv.style.cssText="margin:24px auto 0;display:block;padding:9px 14px";
  dv.textContent="Hapus kendaraan ini";
  dv.onclick=()=>delVehicle(v.id);
  m.appendChild(dv);
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------- actions ---------- */
function markDone(id){
  const v=vehicle();const r=v.reminders.find(x=>x.id===id);if(!r)return;
  r.base=v.odo;save();render();toast(`"${r.name}" ditandai sudah diganti di ${nf(v.odo)} km`);
}
function delReminder(id){
  const v=vehicle();const r=v.reminders.find(x=>x.id===id);if(!r)return;
  confirmModal("Hapus pengingat?",`"${r.name}" akan dihapus.`,()=>{
    v.reminders=v.reminders.filter(x=>x.id!==id);save();render();toast("Pengingat dihapus");
  });
}
function delVehicle(id){
  const v=state.vehicles.find(x=>x.id===id);if(!v)return;
  confirmModal("Hapus kendaraan?",`"${v.name}" beserta semua pengingatnya akan dihapus.`,()=>{
    state.vehicles=state.vehicles.filter(x=>x.id!==id);
    state.selected=state.vehicles[0]?state.vehicles[0].id:null;
    save();render();toast("Kendaraan dihapus");
  });
}

/* ---------- modals ---------- */
function openSheet(html){const s=$("#scrim");$("#sheet").innerHTML=html;s.classList.add("show");}
function closeSheet(){$("#scrim").classList.remove("show");}
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet();});

function vehicleModal(){
  openSheet(`
    <h3>🚗 Kendaraan Baru</h3>
    <div class="field"><label>Nama kendaraan</label>
      <input id="vn" placeholder="cth: Honda Beat, Avanza Hitam" autocomplete="off"></div>
    <div class="field"><label>Odometer saat ini (km)</label>
      <input id="vo" inputmode="numeric" placeholder="cth: 12500">
      <div class="hint">Lihat di speedometer / dasbor kendaraanmu.</div></div>
    <div class="row"><button class="btn ghost" id="c">Batal</button><button class="btn primary" id="ok">Simpan</button></div>
  `);
  const vn=$("#vn");vn.focus();
  $("#c").onclick=closeSheet;
  $("#ok").onclick=()=>{
    const name=vn.value.trim();if(!name)return vn.focus();
    const v={id:uid(),name,odo:clean($("#vo").value),reminders:[]};
    state.vehicles.push(v);state.selected=v.id;save();render();closeSheet();
    toast("Kendaraan ditambahkan");
  };
}

function odoModal(){
  const v=vehicle();
  openSheet(`
    <h3>🔢 Update Odometer</h3>
    <div class="field"><label>Odometer terkini — ${esc(v.name)} (km)</label>
      <input id="oi" inputmode="numeric" value="${v.odo}">
      <div class="hint">Masukkan angka odometer terbaru. Semua sisa km dihitung ulang otomatis.</div></div>
    <div class="row"><button class="btn ghost" id="c">Batal</button><button class="btn primary" id="ok">Simpan</button></div>
  `);
  const oi=$("#oi");oi.focus();oi.select();
  $("#c").onclick=closeSheet;
  $("#ok").onclick=()=>{
    const val=clean(oi.value);
    if(val<v.odo){
      confirmModal("Odometer turun?",`Angka baru (${nf(val)}) lebih kecil dari sebelumnya (${nf(v.odo)}). Tetap simpan?`,()=>{
        v.odo=val;save();render();toast("Odometer diperbarui");
      });return;
    }
    v.odo=val;save();render();closeSheet();toast("Odometer diperbarui");
  };
}

function reminderModal(){
  const v=vehicle();
  openSheet(`
    <h3>🔔 Pengingat Baru</h3>
    <div class="field"><label>Nama pengingat</label>
      <input id="rn" placeholder="cth: Ganti Oli, Ganti Ban, Servis Rutin" autocomplete="off"></div>
    <div class="field"><label>Interval (km)</label>
      <input id="ri" inputmode="numeric" placeholder="cth: 2000">
      <div class="hint">Setiap berapa km diulang.</div></div>
    <div class="field"><label>Terakhir diganti di odometer (km)</label>
      <input id="rb" inputmode="numeric" value="${v.odo}">
      <div class="hint">Default = odometer sekarang (${nf(v.odo)} km). Ubah jika kamu tahu kapan terakhir diganti.</div></div>
    <div class="row"><button class="btn ghost" id="c">Batal</button><button class="btn primary" id="ok">Simpan</button></div>
  `);
  const rn=$("#rn");rn.focus();
  $("#c").onclick=closeSheet;
  $("#ok").onclick=()=>{
    const name=rn.value.trim();const interval=clean($("#ri").value);
    if(!name)return rn.focus();
    if(interval<=0)return $("#ri").focus();
    v.reminders.push({id:uid(),name,interval,base:clean($("#rb").value)});
    save();render();closeSheet();toast("Pengingat ditambahkan");
  };
}

function confirmModal(title,msg,onYes){
  openSheet(`
    <h3>${title}</h3>
    <p style="color:var(--muted);font-size:14px;line-height:1.55;margin:-6px 0 18px">${msg}</p>
    <div class="row"><button class="btn ghost" id="c">Batal</button>
      <button class="btn" id="ok" style="background:var(--red);color:#fff;border:none">Ya, lanjutkan</button></div>
  `);
  $("#c").onclick=closeSheet;
  $("#ok").onclick=()=>{closeSheet();onYes();};
}

/* ---------- menu / export / import ---------- */
$("#menuBtn").onclick=()=>{
  openSheet(`
    <h3 style="margin-bottom:6px">Menu</h3>
    <button class="menu-item" id="exp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <span>Export data (backup)<small>Simpan semua datamu ke file .json</small></span>
    </button>
    <button class="menu-item" id="imp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <span>Import data<small>Pulihkan dari file backup .json</small></span>
    </button>
    <button class="menu-item" id="about">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      <span>Tentang & tips backup<small>Kenapa export rutin itu penting</small></span>
    </button>
  `);
  $("#exp").onclick=()=>{closeSheet();doExport();};
  $("#imp").onclick=()=>{closeSheet();$("#fileInput").click();};
  $("#about").onclick=()=>{closeSheet();aboutModal();};
};

function doExport(){
  const data=JSON.stringify({app:"garasi-log",version:1,exportedAt:new Date().toISOString(),state},null,2);
  const blob=new Blob([data],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const d=new Date();const stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  const a=document.createElement("a");a.href=url;a.download=`garasi-log-${stamp}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("Backup diunduh");
}

$("#fileInput").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const obj=JSON.parse(rd.result);
      const inc=obj.state&&Array.isArray(obj.state.vehicles)?obj.state
               :(Array.isArray(obj.vehicles)?obj:null);
      if(!inc)throw new Error("format");
      const n=inc.vehicles.length;
      confirmModal("Ganti semua data?",`File berisi ${n} kendaraan. Data saat ini akan diganti seluruhnya dengan isi backup ini.`,()=>{
        state={vehicles:inc.vehicles,selected:inc.selected||(inc.vehicles[0]?inc.vehicles[0].id:null)};
        // sanity defaults
        state.vehicles.forEach(v=>{v.odo=clean(v.odo);if(!Array.isArray(v.reminders))v.reminders=[];
          v.reminders.forEach(r=>{r.interval=clean(r.interval);r.base=clean(r.base);});});
        save();render();toast(`Berhasil impor ${n} kendaraan`);
      });
    }catch(err){toast("File tidak valid / bukan backup Garasi Log");}
    finally{e.target.value="";}
  };
  rd.readAsText(f);
});

function aboutModal(){
  openSheet(`
    <h3>ℹ️ Tentang Garasi Log</h3>
    <p style="color:var(--muted);font-size:13.5px;line-height:1.6;margin:-4px 0 14px">
      Aplikasi offline. Semua data disimpan <b style="color:var(--text)">di perangkat ini saja</b> (penyimpanan browser) — tidak ada server, tidak dikirim ke mana pun.</p>
    <p style="color:var(--muted);font-size:13.5px;line-height:1.6;margin:0 0 16px">
      ⚠️ Karena tersimpan lokal, data bisa hilang jika kamu menghapus data situs / aplikasi. Biasakan <b style="color:var(--amber)">Export backup</b> secara rutin lalu simpan file .json-nya di Google Drive atau folder aman.</p>
    <div class="row"><button class="btn primary" id="c">Mengerti</button></div>
  `);
  $("#c").onclick=closeSheet;
}

/* ---------- toast ---------- */
let tT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),2600);}

/* ---------- PWA: install + persist + SW ---------- */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;
  if(!localStorage.getItem("install-dismissed"))$("#install").classList.add("show");});
$("#installBtn").onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();
  await deferredPrompt.userChoice;deferredPrompt=null;$("#install").classList.remove("show");};
$("#installX").onclick=()=>{$("#install").classList.remove("show");localStorage.setItem("install-dismissed","1");};
window.addEventListener("appinstalled",()=>{$("#install").classList.remove("show");toast("Terpasang ✓");});

async function initStorage(){
  // Ask browser to keep our data (best-effort; reduces auto-eviction)
  try{if(navigator.storage&&navigator.storage.persist){await navigator.storage.persist();}}catch(e){}
}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").catch(err=>console.warn("SW gagal",err));
  });
}

/* ---------- boot ---------- */
load();render();initStorage();
</script>
</body>
</html>
